[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-session-analyzer"
version = "4.1.0"
description = "Multi-agent session analyzer for Claude Code, OpenAI Codex, and Qwen CLI"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Franco Micalizzi"}
]
keywords = [
    "claude",
    "claude-code",
    "codex",
    "qwen",
    "ai-agents",
    "session-analyzer",
    "token-tracking",
    "subagents",
    "llm-analytics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
ai-session-analyzer = "process_sessions:main"
process-sessions = "process_sessions:main"

[tool.setuptools]
py-modules = ["process_sessions", "ai_session_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
